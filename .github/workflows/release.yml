name: Release Cross-Platform Desktop POS (Linux, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    name: Inisialisasi GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or Locate Release
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : (context.payload.inputs?.tag || 'v1.0.0');

            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
              console.log('Menggunakan rilis yang sudah ada: ' + data.id);
              return data.id;
            } catch (err) {
              console.log('Membuat rilis baru untuk tag ' + tag);
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: 'ILoveBesi POS Desktop ' + tag,
                body: 'Rilis otomatis lintas platform aplikasi kasir desktop ILoveBesi untuk Linux (.rpm, .deb, .AppImage), Windows (.exe NSIS, .msi), dan macOS (.dmg Apple Silicon & Intel).',
                draft: true,
                prerelease: false,
              });
              return data.id;
            }

  release:
    name: Build and Upload (${{ matrix.name }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux x64
          - platform: windows-latest
            name: Windows x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS Apple Silicon
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS Intel

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (GTK, WebKit2GTK, RPM, AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            file \
            libssl-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build and Upload Artifacts to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.target && format('-{0}target {1}', '-', matrix.target) || '' }}

      - name: Package Linux Installers and Guide into ZIP
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          RPM_FILE=$(find src-tauri/target -name "*.rpm" | head -n 1)
          DEB_FILE=$(find src-tauri/target -name "*.deb" | head -n 1)
          APPIMAGE_FILE=$(find src-tauri/target -name "*.AppImage" | head -n 1)

          if [ -n "$RPM_FILE" ]; then
            zip -j ILoveBesi-POS-Linux-RPM.zip "$RPM_FILE" PANDUAN-INSTALASI-DAN-PENGGUNAAN.txt
          fi
          if [ -n "$DEB_FILE" ]; then
            zip -j ILoveBesi-POS-Linux-DEB.zip "$DEB_FILE" PANDUAN-INSTALASI-DAN-PENGGUNAAN.txt
          fi
          if [ -n "$APPIMAGE_FILE" ]; then
            zip -j ILoveBesi-POS-Linux-AppImage.zip "$APPIMAGE_FILE" PANDUAN-INSTALASI-DAN-PENGGUNAAN.txt
          fi

      - name: Package Windows Installer and Guide into ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Path "src-tauri\target" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*bundle*" } | Select-Object -First 1)?.FullName
          $msi = (Get-ChildItem -Path "src-tauri\target" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*bundle*" } | Select-Object -First 1)?.FullName
          New-Item -ItemType Directory -Path "win_pkg" -Force
          if ($exe) { Copy-Item $exe -Destination "win_pkg\" }
          if ($msi) { Copy-Item $msi -Destination "win_pkg\" }
          Copy-Item "PANDUAN-INSTALASI-DAN-PENGGUNAAN.txt" -Destination "win_pkg\"
          Compress-Archive -Path "win_pkg\*" -DestinationPath "ILoveBesi-POS-Windows-64bit.zip" -Force

      - name: Package macOS Installer and Guide into ZIP
        if: matrix.platform == 'macos-latest'
        run: |
          DMG_FILE=$(find src-tauri/target -name "*.dmg" | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
              zip -j ILoveBesi-POS-macOS-Apple-Silicon.zip "$DMG_FILE" PANDUAN-INSTALASI-DAN-PENGGUNAAN.txt
            else
              zip -j ILoveBesi-POS-macOS-Intel.zip "$DMG_FILE" PANDUAN-INSTALASI-DAN-PENGGUNAAN.txt
            fi
          fi

      - name: Upload ZIP Packages and Guide to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          CLOBBER_OPT=$(printf '%s%s' '-' '-clobber')

          ZIP_FILES=$(ls ILoveBesi-POS-*.zip 2>/dev/null || true)
          if [ -n "$ZIP_FILES" ]; then
            echo "Mengunggah paket ZIP ke release: $ZIP_FILES"
            gh release upload "$TAG" $ZIP_FILES $CLOBBER_OPT
          fi

          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ] && [ -f "PANDUAN-INSTALASI-DAN-PENGGUNAAN.txt" ]; then
            echo "Mengunggah PANDUAN-INSTALASI-DAN-PENGGUNAAN.txt dari runner Linux"
            gh release upload "$TAG" "PANDUAN-INSTALASI-DAN-PENGGUNAAN.txt" $CLOBBER_OPT
          fi

  publish-release:
    name: Publikasikan Release
    needs: [create-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Draft Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
