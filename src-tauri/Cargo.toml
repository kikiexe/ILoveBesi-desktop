[package]
name = "ilovebesi-desktop"
version = "1.1.0"
description = "ILoveBesi - Aplikasi Kasir Desktop POS"
authors = ["ILoveBesi Team"]
edition = "2021"

[lib]
name = "ilovebesi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
